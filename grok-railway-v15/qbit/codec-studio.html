<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Codec Studio — qbitOS Canvas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0c12;
  color:#d1d9e6;
  font:13px/1.5 "SF Mono","Menlo","Consolas",monospace;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#header {
  background:#161b22;
  border-bottom:1px solid #21262d;
  padding:6px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  user-select:none;
}
#logo { color:#c9a84c; font-weight:700; letter-spacing:1px; }
#toolbar {
  background:#21262d;
  padding:4px 8px;
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
  border-bottom:1px solid #30363d;
}
button {
  background:#30363d;
  border:1px solid #484f58;
  color:#8b949e;
  padding:3px 8px;
  border-radius:3px;
  font:inherit;
  cursor:pointer;
  white-space:nowrap;
}
button:hover { border-color:#58a6ff; color:#c9d1d9; }
button.active { border-color:#3fb950; color:#3fb950; }
#main {
  flex:1;
  display:flex;
  overflow:hidden;
}
#canvas-area {
  flex:1;
  background:#0d1117;
  position:relative;
  overflow:auto;
}
#canvas {
  background:#1a202e;
  box-shadow:0 0 0 1px #30363d;
  image-rendering:pixelated;
}
#sidebar {
  width:240px;
  background:#161b22;
  border-left:1px solid #30363d;
  overflow-y:auto;
  padding:8px;
  font-size:11px;
}
.panel {
  margin-bottom:12px;
}
.panel-title {
  font-size:10px;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:#8b949e;
  margin-bottom:4px;
}
input[type=range] {
  accent-color:#58a6ff;
  width:100%;
}
.color-swatch {
  display:inline-block;
  width:18px;
  height:18px;
  border:1px solid #484f58;
  border-radius:2px;
  cursor:pointer;
}
#status {
  padding:4px 8px;
  background:#21262d;
  font-size:10px;
  color:#484f58;
  border-top:1px solid #30363d;
}
</style>
</head>
<body>
<div id="header">
  <span id="logo">CODEC</span>
  <span>qbitOS Canvas</span>
  <span style="flex:1"></span>
  <button onclick="newCanvas()">New</button>
  <button onclick="saveCanvas()">Save</button>
  <button onclick="loadCanvas()">Load</button>
</div>
<div id="toolbar">
  <button onclick="setTool('draw')" class="active">Draw</button>
  <button onclick="setTool('erase')">Erase</button>
  <button onclick="setTool('line')">Line</button>
  <button onclick="setTool('rect')">Rect</button>
  <button onclick="setTool('fill')">Fill</button>
  <span style="margin:0 6px;color:#30363d">|</span>
  <input type="color" id="color" value="#c9a84c" style="width:32px;height:24px;padding:0;border:none;background:transparent;">
  <input type="range" id="brushSize" min="1" max="32" value="4">
  <span id="sizeVal" style="width:24px;text-align:right;color:#8b949e">4</span>
  <span style="flex:1"></span>
  <button onclick="clearCanvas()">Clear</button>
</div>
<div id="main">
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
  </div>
  <div id="sidebar">
    <div class="panel">
      <div class="panel-title">Layers</div>
      <div style="display:flex;flex-direction:column;gap:2px" id="layers"></div>
    </div>
    <div class="panel">
      <div class="panel-title">History</div>
      <div style="font-size:9px;color:#484f58" id="history"></div>
    </div>
  </div>
</div>
<div id="status">
  qbitOS Codec Canvas — ready
</div>

<script>
// Simple canvas editor
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let lastX = 0;
let lastY = 0;
let currentTool = 'draw';
let brushSize = 4;
let currentColor = '#c9a84c';

function resizeCanvas() {
  const area = document.getElementById('canvas-area');
  canvas.width = Math.floor(area.clientWidth * 0.92);
  canvas.height = Math.floor(area.clientHeight * 0.88);
  ctx.fillStyle = '#1a202e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
  const activeBtn = Array.from(document.querySelectorAll('#toolbar button')).find(b => b.textContent.trim() === tool.charAt(0).toUpperCase() + tool.slice(1));
  if (activeBtn) activeBtn.classList.add('active');
}

document.getElementById('brushSize').addEventListener('input', function() {
  brushSize = parseInt(this.value);
  document.getElementById('sizeVal').textContent = brushSize;
});

document.getElementById('color').addEventListener('input', function() {
  currentColor = this.value;
});

canvas.addEventListener('mousedown', e => {
  isDrawing = true;
  [lastX, lastY] = [e.offsetX, e.offsetY];
});

canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const x = e.offsetX;
  const y = e.offsetY;

  ctx.strokeStyle = currentColor;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = brushSize;

  if (currentTool === 'draw') {
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
  } else if (currentTool === 'erase') {
    ctx.clearRect(x - brushSize/2, y - brushSize/2, brushSize, brushSize);
  } else if (currentTool === 'line') {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
  } else if (currentTool === 'rect') {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeRect(lastX, lastY, x-lastX, y-lastY);
  }

  lastX = x;
  lastY = y;
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

function clearCanvas() {
  ctx.fillStyle = '#1a202e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function newCanvas() {
  if (confirm('Clear canvas?')) clearCanvas();
}

function saveCanvas() {
  const link = document.createElement('a');
  link.download = 'qbit-codec-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function loadCanvas() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'c' && e.metaKey) { e.preventDefault(); clearCanvas(); }
  if (e.key === 's' && e.metaKey) { e.preventDefault(); saveCanvas(); }
  if (e.key === 'n' && e.metaKey) { e.preventDefault(); newCanvas(); }
  if (e.key === '1') setTool('draw');
  if (e.key === '2') setTool('erase');
  if (e.key === '3') setTool('line');
  if (e.key === '4') setTool('rect');
  if (e.key === '5') setTool('fill');
});

// Fill tool (simple flood fill)
function floodFill(x, y, fillColor) {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const targetColor = getPixelColor(data, x, y, canvas.width);
  if (colorsEqual(targetColor, hexToRgb(fillColor))) return;

  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cx >= canvas.width || cy < 0 || cy >= canvas.height) continue;
    const idx = (cy * canvas.width + cx) * 4;
    const current = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    if (!colorsEqual(current, targetColor)) continue;

    data[idx] = parseInt(fillColor.slice(1,3),16);
    data[idx+1] = parseInt(fillColor.slice(3,5),16);
    data[idx+2] = parseInt(fillColor.slice(5,7),16);
    data[idx+3] = 255;

    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
  ctx.putImageData(imageData, 0, 0);
}

function getPixelColor(data, x, y, width) {
  const idx = (y * width + x) * 4;
  return [data[idx], data[idx+1], data[idx+2], data[idx+3]];
}

function colorsEqual(c1, c2) {
  return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b,255];
}

// Tool switch for fill
document.querySelectorAll('#toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.textContent === 'Fill') currentTool = 'fill';
  });
});

canvas.addEventListener('click', e => {
  if (currentTool === 'fill') {
    floodFill(Math.floor(e.offsetX), Math.floor(e.offsetY), currentColor);
  }
});

// Bootstrap
setTool('draw');
</script>
</body>
</html>
