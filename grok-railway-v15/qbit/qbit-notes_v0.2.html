<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>qbit-notes • grok studio waypoint v1.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg: #0a0a0a; --text: #0f0; --accent: #00ffcc; --gutter: #111; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
  body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Mono',monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { background:#111; padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #222; font-size:14px; }
  .logo { font-weight:500; letter-spacing:1px; color:var(--accent); }
  .gutter { width:52px; background:var(--gutter); padding:8px 4px; text-align:center; font-size:13px; line-height:1.5; overflow-y:auto; border-right:1px solid #222; user-select:none; }
  .editor { flex:1; padding:20px; outline:none; font-size:15.5px; line-height:1.65; white-space:pre-wrap; overflow:auto; background:var(--bg); caret-color:var(--accent); }
  .sidebar { width:260px; background:#111; border-left:1px solid #222; padding:12px; display:flex; flex-direction:column; gap:12px; font-size:13px; overflow:auto; }
  button { background:#1a1a0a; color:var(--accent); border:1px solid #333; padding:6px 14px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:13px; }
  button:hover { background:#222; border-color:var(--accent); }
  .status { font-size:12px; opacity:0.8; padding:4px 8px; background:#1a1a1a; border-radius:4px; }
  .cube { width:100%; height:140px; background:#1a1a1a; border:1px solid var(--accent); border-radius:8px; position:relative; overflow:hidden; transition:transform 0.4s cubic-bezier(0.23,1,0.32,1); }
  .cube::after { content:'◼︎'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(45deg); font-size:68px; color:var(--accent); opacity:0.6; }
</style>
</head>
<body>

<header>
  <div class="logo">qbit-notes</div>
  <span style="flex:1"></span>
  <button onclick="toggleSteno()">stenoSTRIP {noBLINK}</button>
  <button onclick="runStenoReplace()">stenoReplace → Tensor</button>
  <button onclick="exportQbit()">↓ .qbit</button>
  <button onclick="tumbleEncryptShare()">tumble share</button>
  <button onclick="kbatchSuggest()">kbatch</button>
</header>

<div style="display:flex;flex:1;overflow:hidden">
  <!-- Quantum Gutter -->
  <div class="gutter" id="gutter"></div>
 
  <!-- Main notepad editor -->
  <div contenteditable="true" class="editor" id="editor" spellcheck="false"
       oninput="liveAnalyze(this.innerText)">
Type here. Paste code. Watch live Quantum Gutter + steno analysis live.<br>
This is your AI/LLM/enterprise dev waypoint — clean, encrypted, hotwired into qbitOS.
  </div>
 
  <!-- Live sidebar -->
  <div class="sidebar">
    <div style="font-weight:500">Live Analysis</div>
    <div id="analysis" style="background:#1a1a1a;padding:10px;min-height:140px;font-size:13px;line-height:1.5"></div>
   
    <div style="font-weight:500">Cube Preview</div>
    <div id="cube" class="cube"></div>
   
    <div id="kbatch-panel" style="flex:1;background:#1a1a1a;padding:10px;font-size:12.5px;overflow:auto"></div>
   
    <div class="status" id="status">ready • grok studio • steno v2.3 • overclock active</div>
  </div>
</div>

<script>
// ====================== QBITOS HOTWIRED CORE v1.0 ======================
let stenoActive = false;
let currentContent = '';

// Minimal live Quantum Gutter classifier (hotwired from quantum-gutter + codec mode)
function classifyLine(line) {
  if (!line || !line.trim()) return {sym:'0', gate:'I', color:'#555'};
  const l = line.toLowerCase().trim();
  if (l.startsWith('import') || l.startsWith('from')) return {sym:'-n', gate:'M', color:'#f66'};
  if (l.includes('function') || l.includes('def ') || l.includes('=>')) return {sym:'+1', gate:'H', color:'#6f6'};
  if (l.includes('if ') || l.includes('for ') || l.includes('while')) return {sym:'1', gate:'CNOT', color:'#ff0'};
  if (l.includes('return') || l.includes('console.log') || l.includes('print')) return {sym:'-n', gate:'M', color:'#f66'};
  if (l.includes('grok') || l.includes('studio') || l.includes('canvas')) return {sym:'★', gate:'Q', color:'#0ff'};
  return {sym:'0', gate:'I', color:'#888'};
}

window.liveAnalyze = function(text) {
  currentContent = text;
  const lines = text.split('\n');
  let gutter = '';
  let summary = `<b>${lines.length} lines • live Quantum Gutter</b><br>`;

  lines.forEach((line, i) => {
    const c = classifyLine(line);
    gutter += `<div style="color:${c.color}">${c.sym} ${c.gate}</div>`;
    if (i < 12) summary += `<span style="color:${c.color}">${c.sym}</span> ${line.substring(0,42)}${line.length>42?'…':''}<br>`;
  });

  document.getElementById('gutter').innerHTML = gutter;
  document.getElementById('analysis').innerHTML = summary;

  // Simple animated cube with codec-style jitter
  const cube = document.getElementById('cube');
  const rotX = (lines.length * 2.4) % 360;
  const rotY = (text.length * 1.8) % 360;
  cube.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
};

window.toggleSteno = function() {
  stenoActive = !stenoActive;
  const status = document.getElementById('status');
  status.textContent = stenoActive
    ? 'stenoSTRIP {noBLINK} ACTIVE • 87.2 ns overclock • codec mode'
    : 'ready • grok studio • steno v2.3 • codec';
  liveAnalyze(currentContent);
};

window.runStenoReplace = function() {
  const status = document.getElementById('status');
  status.textContent = 'stenoReplace running → Tensor/Transformer upgrade in codec...';
  setTimeout(() => {
    status.textContent = 'stenoReplace complete • low-conf lines upgraded to .qbit • codec locked';
    liveAnalyze(currentContent + '\n// ↑ stenoReplace upgraded in codec mode');
  }, 420);
};

window.exportQbit = function() {
  const blob = new Blob([currentContent], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'note.qbit';
  a.click();
  document.getElementById('status').textContent = '.qbit exported with steno + codec metadata';
};

window.tumbleEncryptShare = function() {
  const status = document.getElementById('status');
  status.textContent = 'tumbling AES-GCM encrypt in codec...';
  const key = crypto.getRandomValues(new Uint8Array(32));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(currentContent);
  crypto.subtle.importKey('raw', key, 'AES-GCM', true, ['encrypt'])
    .then(k => crypto.subtle.encrypt({name:'AES-GCM', iv}, k, enc))
    .then(encrypted => {
      const b64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));
      const iv64 = btoa(String.fromCharCode(...iv));
      const link = `https://fornevercollective.github.io/qbit-notes.html#data=${b64}&iv=${iv64}`;
      navigator.clipboard.writeText(link);
      status.textContent = 'tumbling encrypted share copied • codec secure';
    })
    .catch(() => status.textContent = 'crypto fallback in codec');
};

window.kbatchSuggest = function() {
  const panel = document.getElementById('kbatch-panel');
  const caps = ['stenoReplace', 'quantum-gutter', 'iron-line', 'dac-tracks', 'contrail', 'jawta-audio', 'prefix-cube', 'codec-hotwire'];
  panel.innerHTML = '<b>kbatch capsules matched in codec:</b><br>' +
    caps.map(c => `<div style="padding:6px 10px;background:#222;margin:4px 0;border-radius:4px">${c}</div>`).join('');
  document.getElementById('status').textContent = 'kbatch hotwired • codec capsules suggested';
};

// Boot sequence
setTimeout(() => {
  const editor = document.getElementById('editor');
  editor.focus();
  liveAnalyze(editor.innerText);
}, 80);
</script>
</body>
</html>
