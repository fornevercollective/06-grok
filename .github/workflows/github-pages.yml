# Build grok-notes-ts and publish to GitHub Pages (project site: https://<user>.github.io/<repo>/).
# Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: grok-notes-ts/package-lock.json

      - name: Install and build
        working-directory: grok-notes-ts
        env:
          # Project Pages URL is /<repo>/ — must match Vite base or assets 404.
          VITE_BASE_URL: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: grok-notes-ts/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
