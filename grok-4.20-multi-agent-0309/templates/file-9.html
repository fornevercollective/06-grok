<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>GROK › TEAM RAILWAY v13.5 • LIVE MULTI-USER</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--accent:#00ff9f;--accent2:#00eaff;}
body{margin:0;background:var(--bg);color:#00ddaa;font-family:ui-monospace,monospace;font-size:13px;overflow:hidden;}
header{background:#050505;border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;justify-content:space-between;}
.btn{background:#111;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-family:monospace;cursor:pointer;border-radius:3px;}
.btn:hover{background:var(--accent);color:#000;}
.mic-btn.recording{background:#00ff9f;color:#000;animation:pulse 1.2s infinite;}
@keyframes pulse{50%{opacity:0.4;}}
.panel{background:var(--panel);border:1px solid #222;border-radius:6px;margin:10px;padding:14px;}
</style>
</head>
<body>

<header>
  <h1>GROK › TEAM RAILWAY v13.5</h1>
  <div>
    <button onclick="toggleVoice()" id="mic-btn" class="btn mic-btn">🎤 VOICE (18 commands)</button>
    <span id="ws-status" style="margin-left:20px;color:#00ff9f">WS: disconnected</span>
  </div>
</header>

<div class="panel" style="margin:10px">
  <strong>Server URL:</strong> <input id="server-url" value="ws://localhost:8080" style="width:300px;background:#111;color:#0f0;border:1px solid #333;padding:4px;font-family:monospace">
  <button onclick="connectWebSocket()" class="btn">Connect</button>
</div>

<!-- Rest of UI (same as previous version) -->
<div id="console-log" style="height:calc(100vh - 180px);overflow:auto;background:#000;padding:12px;font-size:12px;white-space:pre-wrap;margin:10px"></div>

<script>
// ====================== CONFIG ======================
let WS_URL = "ws://localhost:8080";
let ws = null;
let myId = "Client-" + Math.floor(Math.random()*9999);
let activeAgents = { Oppie: true, Leo: true, Enrico: true, Hans: true };

// ====================== VOICE (18 commands) ======================
const voiceCommands = [
  "pause railway","resume railway","force merge","export steno","export json","clear staging",
  "hop on opp","hop on leo","hop on enrico","hop on hans",
  "hop off opp","hop off leo","hop off enrico","hop off hans",
  "increase depth","decrease depth","start transcript","stop transcript",
  "show agents","reset railway"
];

let recognition = null;

function toggleVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";
    recognition.onresult = (e) => {
      let transcript = "";
      for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      document.getElementById("channel-a").value = transcript || document.getElementById("channel-a").value;
      
      const lower = transcript.toLowerCase();
      for (let cmd of voiceCommands) {
        if (lower.includes(cmd)) {
          log(`[VOICE] → ${cmd}`);
          handleVoiceCommand(cmd);
          return;
        }
      }
    };
  }
  recognition.start();
  document.getElementById("mic-btn").classList.add("recording");
}

function handleVoiceCommand(cmd) {
  if (cmd.includes("pause")) broadcast({type:"pause"});
  if (cmd.includes("resume")) broadcast({type:"resume"});
  if (cmd.includes("force merge")) broadcast({type:"forceMerge"});
  if (cmd.includes("export steno")) exportRailway("steno");
  if (cmd.includes("hop on")) {
    const name = Object.keys(activeAgents).find(n => cmd.includes(n.toLowerCase()));
    if (name) broadcast({type:"toggleAgent", name, value:true});
  }
  if (cmd.includes("hop off")) {
    const name = Object.keys(activeAgents).find(n => cmd.includes(n.toLowerCase()));
    if (name) broadcast({type:"toggleAgent", name, value:false});
  }
  // Add more commands as needed
}

function log(msg) {
  const el = document.getElementById("console-log");
  const ts = new Date().toLocaleTimeString('en-US',{hour12:false});
  el.textContent += `${ts} ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function broadcast(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
}

function connectWebSocket() {
  WS_URL = document.getElementById("server-url").value;
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById("ws-status").textContent = "WS: LIVE";
    log("[WS] Connected to multi-user railway hub");
    broadcast({type:"join", client:myId});
  };
  ws.onmessage = (e) => log("[REMOTE] " + e.data);
  ws.onclose = () => document.getElementById("ws-status").innerHTML = `<span style="color:#f66">WS: disconnected</span>`;
}

// Boot
log("Grok Railway v13.5 initialized — Real multi-user + 18 voice commands active");
connectWebSocket();
</script>
</body>
</html>
