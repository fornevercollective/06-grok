<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>GROK › TEAM RAILWAY v14 • FULL PARITY</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--accent:#00ff9f;--accent2:#00eaff;}
body{margin:0;background:var(--bg);color:#00ddaa;font-family:ui-monospace,monospace;font-size:13px;overflow:hidden;}
header{background:#050505;border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;justify-content:space-between;}
.btn{background:#111;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-family:monospace;cursor:pointer;border-radius:3px;}
.btn:hover{background:var(--accent);color:#000;}
.mic-btn.recording{background:#00ff9f;color:#000;animation:pulse 1.2s infinite;}
@keyframes pulse{50%{opacity:0.4;}}
.panel{background:var(--panel);border:1px solid #222;border-radius:6px;margin:10px;padding:14px;}
#console-log{height:calc(100vh-240px);overflow:auto;background:#000;padding:12px;white-space:pre-wrap;font-size:12px;}
</style>
</head>
<body>

<header>
  <h1>GROK › TEAM RAILWAY v14</h1>
  <div>
    <button onclick="toggleVoice()" id="mic-btn" class="btn mic-btn">🎤 VOICE (18 commands)</button>
    <span id="ws-status" style="margin-left:20px;color:#666">WS: disconnected</span>
  </div>
</header>

<div class="panel">
  <strong>Server URL:</strong> 
  <input id="server-url" value="ws://localhost:8080" style="width:320px;background:#111;color:#0f0;border:1px solid #333;padding:5px;font-family:monospace;">
  <button onclick="connectWebSocket()" class="btn">Connect</button>
</div>

<div class="panel"><h2>STAGING AREA (highlight any text)</h2><div id="staging-area" style="min-height:90px;background:#111;padding:10px">— nothing staged —</div></div>

<div id="console-log"></div>

<script>
// ====================== CORE ======================
let ws = null;
let myId = "Client-" + Math.floor(Math.random()*99999);
let activeAgents = { Oppie: true, Leo: true, Enrico: true, Hans: true };
let tasks = [];

const voiceCommands = ["pause railway","resume railway","force merge","export steno","export json","clear staging","hop on opp","hop on leo","hop on enrico","hop on hans","hop off opp","hop off leo","hop off enrico","hop off hans","increase depth","decrease depth","start transcript","stop transcript"];

function log(msg) {
  const el = document.getElementById("console-log");
  const ts = new Date().toLocaleTimeString('en-US',{hour12:false});
  el.textContent += `${ts} ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function broadcast(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
}

function connectWebSocket() {
  const url = document.getElementById("server-url").value;
  ws = new WebSocket(url);
  ws.onopen = () => {
    document.getElementById("ws-status").innerHTML = `<span style="color:#00ff9f">WS LIVE • Full parity active</span>`;
    log("[WS] Connected to multi-user railway hub");
    broadcast({type:"join", client:myId});
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "state") {
        activeAgents = msg.state.activeAgents || activeAgents;
        tasks = msg.state.tasks || tasks;
        log("[SYNC] State updated from server");
      }
    } catch(_) {}
  };
  ws.onclose = () => document.getElementById("ws-status").innerHTML = `<span style="color:#f66">WS disconnected</span>`;
}

function toggleVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return log("[VOICE] Not supported");
  const rec = new SpeechRecognition();
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    let transcript = "";
    for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    const lower = transcript.toLowerCase();
    for (let cmd of voiceCommands) {
      if (lower.includes(cmd)) {
        log(`[VOICE] Recognized: ${cmd}`);
        broadcast({type:"voice_command", text:cmd});
        return;
      }
    }
  };
  rec.start();
  log("[VOICE] Listening (18 commands supported)");
}

// Boot
log("Grok Railway v14 initialized — Rust + Python(PyTorch trained) + Node.js parity");
connectWebSocket();
</script>
</body>
</html>
