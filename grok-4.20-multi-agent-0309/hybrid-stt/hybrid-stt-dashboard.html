<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Grok Railway v15 • Hybrid STT Dashboard</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--accent:#00ff9f;--accent2:#00eaff;--text:#00ddaa;--mono:ui-monospace,monospace;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;overflow:hidden;height:100vh;}
header{background:#050505;border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
.panel{background:var(--panel);border:1px solid #222;border-radius:6px;padding:12px;margin:8px;}
.terminal{flex:1;background:#000;border:1px solid #222;padding:12px;overflow:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.45;}
.btn{background:#111;color:var(--accent);border:1px solid var(--accent);padding:8px 16px;cursor:pointer;border-radius:6px;margin:4px;}
.btn:hover{background:var(--accent);color:#000;}
.mic-btn.recording{background:#00ff9f;color:#000;animation:pulse 1.2s infinite;}
.status-bar{font-size:12px;display:flex;gap:12px;align-items:center;}
.recording-dot{color:#f66;animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:0.3;}}
</style>
</head>
<body>

<header>
  <h1>Grok Railway v15 • Hybrid STT</h1>
  <div class="status-bar">
    <span id="ws-status">WS: disconnected</span>
    <span id="stt-mode" style="color:#00eaff">Browser STT</span>
    <button onclick="toggleVoice()" id="mic-btn" class="btn mic-btn">🎤 Start Voice Input</button>
    <button onclick="forceWhisper()" class="btn">Force Whisper</button>
  </div>
</header>

<div style="display:grid;grid-template-columns:280px 1fr 360px;gap:8px;height:calc(100vh-68px);padding:8px">
  <!-- Left -->
  <div>
    <div class="panel">
      <h2>Server</h2>
      <input id="server-url" value="ws://localhost:8080/ws" style="width:100%;background:#111;color:#0f0;border:1px solid #333;padding:6px;font-family:var(--mono);">
      <button onclick="connectWebSocket()" class="btn" style="width:100%;margin-top:8px">Connect to Rust Server</button>
    </div>

    <div class="panel">
      <h2>Staging Area</h2>
      <div id="staging-area" style="min-height:160px;background:#111;padding:10px;font-size:12px;overflow:auto">— Highlight any text to stage —</div>
      <button onclick="clearStaging()" class="btn" style="width:100%;margin-top:8px">Clear Staging</button>
    </div>
  </div>

  <!-- Center Terminal -->
  <div class="panel" style="display:flex;flex-direction:column">
    <h2>IronRaw Terminal • Live</h2>
    <pre id="terminal-output" class="terminal">Hybrid STT Dashboard Ready.\nBrowser first → Whisper fallback if confidence low.\nSpeak now...</pre>
  </div>

  <!-- Right -->
  <div>
    <div class="panel">
      <h2>Status</h2>
      <div id="status-panel" style="font-size:12px;line-height:1.6"></div>
    </div>

    <div class="panel">
      <h2>Last Voice Intent</h2>
      <div id="last-intent" style="background:#111;padding:12px;font-size:14px;color:#ff00cc;min-height:80px">—</div>
    </div>

    <div class="panel">
      <h2>Quick Actions</h2>
      <button onclick="exportRailway('steno')" class="btn" style="width:100%;margin-bottom:6px">Export .steno</button>
      <button onclick="forceMerge()" class="btn" style="width:100%">Force Merge</button>
    </div>
  </div>
</div>

<script>
// ====================== STATE ======================
let ws = null;
let lastIntent = "—";
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let confidenceThreshold = 0.75;
let useWhisperNext = false;

// ====================== LOG ======================
function log(msg) {
  const el = document.getElementById("terminal-output");
  const ts = new Date().toLocaleTimeString('en-US',{hour12:false});
  el.textContent += `${ts} ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

// ====================== WEBSOCKET ======================
function connectWebSocket() {
  const url = document.getElementById("server-url").value;
  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById("ws-status").innerHTML = `<span style="color:#00ff9f">● LIVE</span>`;
    log("Connected to Rust server with Whisper support");
    ws.send(JSON.stringify({type:"join", role:"dashboard"}));
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "stt_result") {
        log(`[Whisper] ${msg.text}`);
        document.getElementById("last-intent").textContent = msg.text;
      } else if (msg.type === "log") {
        log(msg.text);
      }
    } catch(err) { log("[ERROR] " + e.data); }
  };

  ws.onclose = () => {
    document.getElementById("ws-status").innerHTML = `<span style="color:#f66">● OFF</span>`;
  };
}

// ====================== HYBRID VOICE ======================
window.toggleVoice = async function() {
  if (isRecording) {
    stopRecording();
    return;
  }

  // Try Browser STT first
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition && !useWhisperNext) {
    const rec = new SpeechRecognition();
    rec.continuous = false;
    rec.interimResults = false;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      const confidence = e.results[0][0].confidence || 0.85;
      log(`[Browser] "${transcript}" (${(confidence*100).toFixed(0)}% confidence)`);
      
      if (confidence >= confidenceThreshold) {
        document.getElementById("last-intent").textContent = transcript;
        if (ws) ws.send(JSON.stringify({type:"voice_command", text:transcript}));
      } else {
        log("[LOW CONFIDENCE] Falling back to Whisper...");
        startAudioRecording();
      }
    };
    rec.onerror = () => { log("[Browser STT failed] Using Whisper"); startAudioRecording(); };
    rec.start();
    document.getElementById("mic-btn").classList.add("recording");
    document.getElementById("status-panel").innerHTML = "Listening with Browser STT...";
    return;
  }

  // Direct Whisper fallback
  startAudioRecording();
};

function startAudioRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      sendAudioToWhisper(blob);
    };
    
    mediaRecorder.start(250); // Send chunks every 250ms for near-real-time
    isRecording = true;
    document.getElementById("mic-btn").classList.add("recording");
    document.getElementById("status-panel").innerHTML = `<span class="recording-dot">●</span> Recording for Whisper...`;
    log("Recording audio for server-side Whisper...");
    
    // Auto-stop after 6 seconds if not stopped manually
    setTimeout(() => { if (isRecording) stopRecording(); }, 6000);
  }).catch(err => {
    log("[MIC ERROR] " + err);
  });
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById("mic-btn").classList.remove("recording");
    document.getElementById("status-panel").innerHTML = "Processing with Whisper...";
  }
}

async function sendAudioToWhisper(blob) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log("[ERROR] WebSocket not connected");
    return;
  }

  const arrayBuffer = await blob.arrayBuffer();
  ws.send(arrayBuffer);  // Send raw binary audio to Rust server
  log(`[AUDIO] Sent ${arrayBuffer.byteLength} bytes to Whisper`);
  useWhisperNext = false;
}

// Force Whisper button
window.forceWhisper = function() {
  useWhisperNext = true;
  toggleVoice();
};

// ====================== OTHER FUNCTIONS ======================
window.clearStaging = function() { log("[STAGING] Cleared"); };
window.exportRailway = function(fmt) {
  if (ws) ws.send(JSON.stringify({type:"export", format:fmt}));
  log(`[EXPORT] ${fmt.toUpperCase()} requested`);
};
window.forceMerge = function() {
  if (ws) ws.send(JSON.stringify({type:"forceMerge"}));
  log("[HITL] Force merge sent");
};

// Boot
log("Grok Railway v15 Hybrid STT Dashboard Loaded");
log("Primary: Browser SpeechRecognition → Automatic fallback to Whisper if confidence low");
log("Click mic or say 'use whisper' to force server-side processing");
connectWebSocket();
</script>
</body>
</html>
